services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-visualizer-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-your_super_secret_payload_key_at_least_32_chars}
      - DATABASE_URI=${DATABASE_URI:-postgres://postgres:postgres@postgres:5432/web_visualizer}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: web-visualizer-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=web_visualizer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_visualizer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
